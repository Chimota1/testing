name: Java CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Вказуємо папку, у якій лежить pom.xml
    defaults:
      run:
        working-directory: sut-b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn clean compile

      - name: Run Unit & API Tests
        run: mvn test

      - name: Upload Test Reports as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          # Вказуємо шлях до звітів з урахуванням підпапки
          path: ваша_папка/target/surefire-reports/
